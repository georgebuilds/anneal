version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/georgebuilds/anneal

issues:
  max-same-issues: 0
