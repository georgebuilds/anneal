name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -short -timeout=10m -coverprofile=coverage.txt ./...
        env:
          GOTRACEBACK: crash
          ANNEAL_NO_GPU: "1"

      # NOTE to maintainer: add CODECOV_TOKEN as a repository secret in
      # repo Settings, Secrets and variables, Actions. Without it, uploads
      # from private repos or protected forks will fail.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Coverage
        run: make coverage
