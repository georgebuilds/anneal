name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Vulkan SW renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build
        run: go build ./...

      - name: Test
        # -p 1 keeps peak memory bounded: the Vulkan SW renderer (lavapipe)
        # plus a second heavy package in parallel can OOM the hosted runner.
        run: go test -short -timeout=12m -p 1 -coverprofile=coverage.txt ./...
        env:
          GOTRACEBACK: crash

      # NOTE to maintainer: add CODECOV_TOKEN as a repository secret in
      # repo Settings, Secrets and variables, Actions. Without it, uploads
      # from private repos or protected forks will fail.
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.txt
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web:
    # Frontend (web/studio.js, web/worker.js) tested under jsdom with Vitest.
    # Separate job so the studio coverage upload is independent of the Go job.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test with coverage
        run: npm run coverage

      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage-js/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
